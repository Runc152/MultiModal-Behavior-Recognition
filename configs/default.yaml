# configs/default.yaml
data:
  rgb_dir: "datasets/NTU/original"   # rgb path
  ir_dir: "datasets/NTU/original_ir"     # ir path
  batch_size: 12
  num_workers: 2
  slow_num_frames: 12
  fast_num_frames: 48
  side_size: 256

model:
  type: "x3d"
  variant: "s"
  feature_dim: 192
  num_classes: 60
  rgb_weight: "weights/X3D_S.pyth"
  ir_weight: "weights/X3D_S.pyth"
  dropout: 0.5
  hidden_dim: 512

train:
  epochs: 80
  lr: 0.0005
  weight_decay: 0.0001
  warmup_epochs: 3
  grad_clip: 1.0
  use_amp: true
  seed: 42
  save_dir: "checkpoints"
  log_interval: 10
  eval_interval: 1

tensorboard:
  log_dir: "tensorboard"

wandb:
  project: "multimodal-behavior-recognition"
  entity: null
  name: null
